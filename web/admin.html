<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M32 12 14 30h11v16h14V30h11z' fill='white'/%3E%3C/svg%3E">
<title>shareUp admin</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#20242d;--text:#e8eaed;--mute:#9aa0aa;--acc:#3b82f6;--line:#2a2f3a}
@media (prefers-color-scheme:light){:root{--bg:#f4f5f7;--card:#fff;--card2:#eef0f3;--text:#111;--mute:#667;--acc:#2563eb;--line:#e1e4e8}}
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:24px 16px}
.wrap{max-width:480px;margin:0 auto}
h1{font-size:22px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
input[type=text],input[type=number],select{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px;font-size:14px}
input[type=text]{flex:1;min-width:0}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer}
button.g{background:var(--card2);color:var(--text)}
button.d{background:#dc2626}
.r{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
#qr{display:block;margin:0 auto;border-radius:12px;background:#fff;padding:10px}
#url{display:block;text-align:center;margin-top:10px;font-size:16px}
#msg{color:#f87171;min-height:18px;font-size:13px;margin-top:6px}
</style></head><body><div class="wrap">
<h1>shareUp</h1>
<div class="card">
 <img id="qr" width="240" height="240" alt="QR">
 <b id="url"></b>
 <div class="r">IP <select id="ip"></select>
  Port <input id="port" type="number" min="1024" max="65535" style="width:90px">
  <button id="sp">Set</button></div>
 <div id="msg"></div>
</div>
<div class="card"><h3>Phone → PC (save folder)</h3>
 <div class="r"><input type="text" id="recv"><button class="g" id="br">Browse</button></div></div>
<div class="card"><h3>PC → Phone sharing</h3>
 <label><input type="checkbox" id="on"> Sharing ON</label>
 <div class="r"><input type="text" id="share"><button class="g" id="bs">Browse</button></div></div>
<button class="d" id="quit">Quit shareUp</button>
<script>
const $=s=>document.querySelector(s);
async function api(path,body){
 const r=await fetch(path,{method:'POST',body:body?JSON.stringify(body):null});
 if(!r.ok){$('#msg').textContent=await r.text();return null}
 $('#msg').textContent='';return r.json();
}
function render(s){
 if(!s)return;
 $('#url').textContent=s.url||'No network found';
 if(s.url)$('#qr').src='/admin/qr.png?u='+encodeURIComponent(s.url)+'&t='+Date.now();
 $('#ip').innerHTML='';s.ips.forEach(i=>{const o=document.createElement('option');o.value=o.textContent=i;if(i==s.ip)o.selected=true;$('#ip').append(o)});
 $('#port').value=s.port;$('#recv').value=s.recvDir;$('#share').value=s.shareDir;$('#on').checked=s.shareOn;
}
async function init(){render(await api('/admin/state'))}
$('#ip').onchange=async()=>render(await api('/admin/set',{ip:$('#ip').value}));
$('#sp').onclick=async()=>{const p=parseInt($('#port').value);const s=await api('/admin/set',{port:p});if(s){location.href='http://localhost:'+s.port+'/admin'}};
$('#recv').onchange=async()=>render(await api('/admin/set',{recvDir:$('#recv').value}));
$('#share').onchange=async()=>render(await api('/admin/set',{shareDir:$('#share').value}));
$('#on').onchange=async()=>render(await api('/admin/set',{shareOn:$('#on').checked}));
$('#br').onclick=async()=>{const j=await api('/admin/browse');if(j&&j.path)render(await api('/admin/set',{recvDir:j.path}))};
$('#bs').onclick=async()=>{const j=await api('/admin/browse');if(j&&j.path)render(await api('/admin/set',{shareDir:j.path}))};
$('#quit').onclick=async()=>{if(!confirm('Stop shareUp?'))return;await api('/admin/quit');document.body.innerHTML='<p style="text-align:center;margin-top:80px">shareUp stopped. You can close this tab.</p>'};
init();
</script></div></body></html>
