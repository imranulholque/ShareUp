<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M32 12 14 30h11v16h14V30h11z' fill='white'/%3E%3C/svg%3E">
<title>shareUp admin</title>
<style>
:root{
 --bg:#0a0c12;--card:rgba(255,255,255,.04);--card-b:rgba(255,255,255,.09);
 --field:rgba(255,255,255,.06);--text:#eef0f6;--mute:#8d94a5;
 --a1:#4f8cff;--a2:#8b5cf6;--ok:#22c55e;--bad:#ef4444;--shadow:rgba(0,0,0,.4)
}
@media (prefers-color-scheme:light){:root{
 --bg:#eef1f8;--card:rgba(255,255,255,.75);--card-b:rgba(20,30,60,.08);
 --field:rgba(20,30,60,.05);--text:#10131c;--mute:#667085;--shadow:rgba(40,60,120,.12)
}}
*{box-sizing:border-box}
html,body{margin:0}
body{
 min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);
 background:
  radial-gradient(900px 500px at 15% -10%,rgba(79,140,255,.25),transparent 60%),
  radial-gradient(800px 500px at 100% 10%,rgba(139,92,246,.22),transparent 60%),
  var(--bg);
 padding:32px 20px 48px;
}
.wrap{max-width:980px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--a1),var(--a2));
 display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(79,140,255,.45)}
h1{font-size:24px;margin:0;letter-spacing:-.02em}
.sub{font-size:12px;color:var(--mute);margin-top:2px}
.pill{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;font-size:13px;
 background:var(--card);border:1px solid var(--card-b);backdrop-filter:blur(10px)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(34,197,94,.7);animation:pulse 2s infinite}
.dot.off{background:var(--bad);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}

.grid{display:grid;grid-template-columns:380px 1fr;gap:20px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--card-b);border-radius:22px;padding:22px;
 backdrop-filter:blur(14px);box-shadow:0 18px 50px var(--shadow)}
.card+.card{margin-top:20px}
.col{display:flex;flex-direction:column}
h3{margin:0 0 14px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600;
 display:flex;align-items:center;gap:8px}

/* QR */
.qrbox{position:relative;width:272px;height:272px;margin:4px auto 0}
.qrbox::before{content:"";position:absolute;inset:-4px;border-radius:26px;
 background:conic-gradient(from 0deg,var(--a1),var(--a2),#ec4899,var(--a1));filter:blur(14px);opacity:.65;animation:spin 8s linear infinite}
.qrbox::after{content:"";position:absolute;inset:-2px;border-radius:24px;
 background:conic-gradient(from 0deg,var(--a1),var(--a2),#ec4899,var(--a1));animation:spin 8s linear infinite;
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:2px}
@keyframes spin{to{transform:rotate(360deg)}}
#qr{position:relative;z-index:1;width:100%;height:100%;border-radius:22px;background:#fff;padding:14px;display:block}
.hint{text-align:center;color:var(--mute);font-size:13px;margin:18px 0 12px}
.urlrow{display:flex;gap:8px;align-items:center;background:var(--field);border:1px solid var(--card-b);border-radius:14px;padding:6px 6px 6px 14px}
#url{flex:1;font-size:15px;font-weight:600;font-family:ui-monospace,Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* controls */
label.f{display:block;font-size:12px;color:var(--mute);margin:0 0 6px}
input[type=text],input[type=number],select{
 width:100%;background:var(--field);color:var(--text);border:1px solid var(--card-b);border-radius:12px;
 padding:11px 13px;font-size:14px;outline:none;transition:.15s;font-family:inherit}
input:focus,select:focus{border-color:var(--a1);box-shadow:0 0 0 3px rgba(79,140,255,.2)}
select option{background:#1a1d27;color:#eee}
.r{display:flex;gap:10px;align-items:flex-end}
.r>div{flex:1;min-width:0}
.r>div.fix{flex:0 0 110px}
button{border:0;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;color:#fff;
 background:linear-gradient(135deg,var(--a1),var(--a2));transition:.15s;font-family:inherit;white-space:nowrap}
button:hover{transform:translateY(-1px);filter:brightness(1.1)}
button:active{transform:none}
button.g{background:var(--field);color:var(--text);border:1px solid var(--card-b)}
button.g:hover{border-color:var(--a1)}
button.sm{padding:9px 14px;border-radius:10px}
.pathrow{display:flex;gap:10px}
#msg{color:#f87171;font-size:13px;min-height:18px;margin-top:12px}

/* switch */
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.sw b{font-size:15px}.sw small{display:block;color:var(--mute);font-size:12px;margin-top:2px;font-weight:400}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.slider{position:absolute;inset:0;background:var(--field);border:1px solid var(--card-b);border-radius:999px;cursor:pointer;transition:.2s}
.slider::before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.switch input:checked+.slider{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent}
.switch input:checked+.slider::before{transform:translateX(22px)}

.quit{margin-top:20px;display:flex;justify-content:flex-end}
button.d{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.35)}
button.d:hover{background:#ef4444;color:#fff}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:#111827;color:#fff;padding:10px 18px;
 border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body><div class="wrap">

<header>
 <div class="brand">
  <div class="logo"><svg width="24" height="24" viewBox="0 0 64 64"><path d="M32 8 10 30h13v20h18V30h13z" fill="#fff"/></svg></div>
  <div><h1>shareUp</h1><div class="sub">Local file sharing, no cloud, no limits</div></div>
 </div>
 <div class="pill"><span class="dot" id="dot"></span><span id="status">Running</span></div>
</header>

<div class="grid">
 <div class="card">
  <h3>Scan with your phone</h3>
  <div class="qrbox"><img id="qr" alt="QR"></div>
  <div class="hint">Open the camera and point it at the code.<br>Works in any browser.</div>
  <div class="urlrow"><span id="url"></span><button class="sm" id="cp">Copy</button></div>
 </div>

 <div class="col">
  <div class="card">
   <h3>Network</h3>
   <div class="r">
    <div><label class="f">IP address</label><select id="ip"></select></div>
    <div class="fix"><label class="f">Port</label><input id="port" type="number" min="1024" max="65535"></div>
    <button id="sp">Apply</button>
   </div>
   <div id="msg"></div>
  </div>

  <div class="card">
   <h3>📥 Phone → PC</h3>
   <label class="f">Uploaded files are saved here</label>
   <div class="pathrow"><input type="text" id="recv"><button class="g" id="br">Browse</button></div>
  </div>

  <div class="card">
   <div class="sw">
    <div><b>📤 PC → Phone sharing</b><small>Let phones see and download files from a folder</small></div>
    <label class="switch"><input type="checkbox" id="on"><span class="slider"></span></label>
   </div>
   <label class="f">Shared folder</label>
   <div class="pathrow"><input type="text" id="share"><button class="g" id="bs">Browse</button></div>
  </div>

  <div class="quit"><button class="d" id="quit">Quit shareUp</button></div>
 </div>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1600)}
async function api(path,body){
 const r=await fetch(path,{method:'POST',body:body?JSON.stringify(body):null});
 if(!r.ok){$('#msg').textContent=await r.text();return null}
 $('#msg').textContent='';return r.json();
}
let lastUrl='';
function render(s){
 if(!s)return;
 $('#url').textContent=s.url||'No network found';
 if(s.url&&s.url!==lastUrl){lastUrl=s.url;$('#qr').src='/admin/qr.png?u='+encodeURIComponent(s.url)}
 $('#ip').innerHTML='';
 s.ips.forEach(i=>{const o=document.createElement('option');o.value=o.textContent=i;if(i==s.ip)o.selected=true;$('#ip').append(o)});
 $('#port').value=s.port;$('#recv').value=s.recvDir;$('#share').value=s.shareDir;$('#on').checked=s.shareOn;
 $('#dot').classList.toggle('off',!s.url);
 $('#status').textContent=s.url?'Running':'No network';
}
async function init(){render(await api('/admin/state'))}
$('#ip').onchange=async()=>render(await api('/admin/set',{ip:$('#ip').value}));
$('#sp').onclick=async()=>{const p=parseInt($('#port').value);const s=await api('/admin/set',{port:p});if(s){location.href='http://localhost:'+s.port+'/admin'}};
$('#recv').onchange=async()=>render(await api('/admin/set',{recvDir:$('#recv').value}));
$('#share').onchange=async()=>render(await api('/admin/set',{shareDir:$('#share').value}));
$('#on').onchange=async()=>{render(await api('/admin/set',{shareOn:$('#on').checked}));toast($('#on').checked?'Sharing ON':'Sharing OFF')};
$('#br').onclick=async()=>{const j=await api('/admin/browse');if(j&&j.path)render(await api('/admin/set',{recvDir:j.path}))};
$('#bs').onclick=async()=>{const j=await api('/admin/browse');if(j&&j.path)render(await api('/admin/set',{shareDir:j.path}))};
$('#cp').onclick=async()=>{
 const u=$('#url').textContent;
 try{await navigator.clipboard.writeText(u)}catch(e){const t=document.createElement('textarea');t.value=u;document.body.append(t);t.select();document.execCommand('copy');t.remove()}
 toast('Link copied');
};
$('#quit').onclick=async()=>{if(!confirm('Stop shareUp?'))return;await api('/admin/quit');document.body.innerHTML='<p style="text-align:center;margin-top:120px;font-family:system-ui;color:#999">shareUp stopped. You can close this tab.</p>'};
init();
</script></body></html>
