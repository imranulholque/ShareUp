<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M32 12 14 30h11v16h14V30h11z' fill='white'/%3E%3C/svg%3E">
<title>shareUp</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#20242d;--text:#e8eaed;--mute:#9aa0aa;--acc:#3b82f6;--line:#2a2f3a}
@media (prefers-color-scheme:light){:root{--bg:#f4f5f7;--card:#fff;--card2:#eef0f3;--text:#111;--mute:#667;--acc:#2563eb;--line:#e1e4e8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px 32px}
.wrap{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--acc);display:flex;align-items:center;justify-content:center}
h1{font-size:20px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.card h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 12px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.pick{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 12px;border:1.5px dashed var(--line);border-radius:12px;color:var(--mute);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--acc);color:#fff;padding:10px 20px;border-radius:999px;font-size:15px;font-weight:600;cursor:pointer}
.btn2{background:var(--card2);color:var(--text);padding:6px 12px;border-radius:999px;border:0;font-size:13px}
.up{background:var(--card2);border-radius:10px;padding:10px 12px;margin-top:8px}
.up .n{font-size:14px;word-break:break-all}
.up small{color:var(--mute);font-size:12px}
progress{width:100%;height:6px;margin:6px 0 2px;accent-color:var(--acc)}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;color:var(--mute);word-break:break-all}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.tile{background:var(--card2);border-radius:12px;padding:8px;text-align:center;color:var(--text);text-decoration:none;display:block;cursor:pointer;min-width:0}
.th{height:84px;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.th img,.th video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.badge{width:54px;height:68px;border-radius:8px;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px}
.nm{font-size:12px;margin-top:6px;word-break:break-word;max-height:2.6em;overflow:hidden}
.sz{font-size:11px;color:var(--mute)}
.empty{color:var(--mute);font-size:14px;text-align:center;padding:12px}
</style></head><body><div class="wrap">
<header><div class="logo"><svg width="20" height="20" viewBox="0 0 64 64"><path d="M32 10 12 30h12v18h16V30h12z" fill="#fff"/></svg></div><h1>shareUp</h1></header>

<div class="card">
 <h2>Send to PC</h2>
 <div class="pick">
  <label class="btn">＋ Choose files<input id="f" type="file" multiple hidden></label>
  <span>Any file, any size</span>
 </div>
 <div id="ups"></div>
</div>

<div class="card">
 <h2>Files from PC <button class="btn2" id="rf">Refresh</button></h2>
 <div id="bar" class="bar"></div>
 <div id="dl"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const inp=$('#f'),ups=$('#ups');
inp.onchange=async()=>{const fs=[...inp.files];for(const f of fs)await up(f);inp.value=''};
function up(f){return new Promise(res=>{
 const row=document.createElement('div');row.className='up';
 row.innerHTML='<div class="n"></div><progress max="100" value="0"></progress><small>0%</small>';
 row.querySelector('.n').textContent=f.name;ups.prepend(row);
 const p=row.querySelector('progress'),s=row.querySelector('small');
 const x=new XMLHttpRequest();
 x.open('POST','/upload?name='+encodeURIComponent(f.name));
 x.upload.onprogress=e=>{if(e.lengthComputable){const v=Math.round(e.loaded/e.total*100);p.value=v;s.textContent=v+'%'}};
 x.onload=()=>{s.textContent=x.status==200?'✓ Done':'✗ Error';res()};
 x.onerror=()=>{s.textContent='✗ Failed';res()};
 x.send(f);
})}

function sz(n){const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<4){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]}
const IMG=['jpg','jpeg','png','gif','webp','bmp','svg','avif'];
const VID=['mp4','webm','mov','m4v'];
const GROUPS=[
 [['pdf'],'#dc2626','PDF'],
 [['doc','docx','odt','rtf'],'#2563eb','DOC'],
 [['xls','xlsx','csv','ods'],'#16a34a','XLS'],
 [['ppt','pptx','odp'],'#ea580c','PPT'],
 [['zip','rar','7z','tar','gz'],'#ca8a04','ZIP'],
 [['mp3','wav','flac','m4a','aac','ogg'],'#9333ea','AUDIO'],
 [['mp4','mkv','avi','mov','webm'],'#db2777','VIDEO'],
 [['apk','exe','msi','dmg'],'#475569','APP'],
 [['txt','md','log'],'#64748b','TXT'],
 [['jpg','jpeg','png','gif','webp','bmp','svg','avif','heic'],'#0891b2','IMG'],
];
function badge(name){
 const e=(name.includes('.')?name.split('.').pop():'').toLowerCase();
 let c='#6b7280',l=(e||'FILE').toUpperCase().slice(0,4);
 for(const g of GROUPS)if(g[0].includes(e)){c=g[1];l=g[2];break}
 const b=document.createElement('div');b.className='badge';b.style.background=c;b.textContent=l;return b;
}
const FOLDER='<svg width="64" height="54" viewBox="0 0 24 20"><path d="M1 3a2 2 0 0 1 2-2h6l2 2h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2z" fill="#d97706"/><path d="M1 7h22v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2z" fill="#fbbf24"/></svg>';

let cur='';
function tile(it){
 const full=(cur?cur+'/':'')+it.name;
 const enc=full.split('/').map(encodeURIComponent).join('/');
 const el=document.createElement(it.dir?'div':'a');el.className='tile';
 const th=document.createElement('div');th.className='th';
 const ext=(it.name.split('.').pop()||'').toLowerCase();
 if(it.dir){th.innerHTML=FOLDER;el.onclick=()=>{cur=full;load()}}
 else{
  el.href='/dl/'+enc;el.setAttribute('download','');
  if(IMG.includes(ext)){
   const im=document.createElement('img');im.loading='lazy';im.src='/dl/'+enc;
   im.onerror=()=>{th.textContent='';th.append(badge(it.name))};th.append(im);
  }else if(VID.includes(ext)){
   const v=document.createElement('video');v.muted=true;v.preload='metadata';v.playsInline=true;
   v.src='/dl/'+enc+'#t=0.1';v.onerror=()=>{th.textContent='';th.append(badge(it.name))};th.append(v);
  }else th.append(badge(it.name));
 }
 const n=document.createElement('div');n.className='nm';n.textContent=it.name;
 el.append(th,n);
 if(!it.dir){const s=document.createElement('div');s.className='sz';s.textContent=sz(it.size);el.append(s)}
 return el;
}
async function load(){
 const d=$('#dl'),bar=$('#bar');d.textContent='';bar.textContent='';
 try{
  const j=await (await fetch('/api/list?path='+encodeURIComponent(cur))).json();
  if(!j.shareOn){d.innerHTML='<div class="empty">PC sharing is off</div>';return}
  if(cur){
   const b=document.createElement('button');b.className='btn2';b.textContent='← Back';
   b.onclick=()=>{cur=cur.split('/').slice(0,-1).join('/');load()};
   const p=document.createElement('span');p.textContent='/'+cur;bar.append(b,p);
  }
  if(!j.items.length){d.innerHTML='<div class="empty">Empty</div>';return}
  const g=document.createElement('div');g.className='grid';
  j.items.forEach(it=>g.append(tile(it)));d.append(g);
 }catch(e){d.innerHTML='<div class="empty">Error</div>'}
}
$('#rf').onclick=load;load();
</script></div></body></html>
