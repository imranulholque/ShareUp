name: build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Make icon
        run: |
          pip install pillow
          python3 - <<'EOF'
          from PIL import Image, ImageDraw
          S = 256
          im = Image.new('RGBA', (S, S), (0, 0, 0, 0))
          d = ImageDraw.Draw(im)
          d.rounded_rectangle((0, 0, S - 1, S - 1), radius=56, fill=(37, 99, 235, 255))
          d.polygon([(128, 44), (60, 118), (104, 118), (104, 172), (152, 172), (152, 118), (196, 118)], fill='white')
          d.rounded_rectangle((60, 196, 196, 212), radius=8, fill='white')
          im.save('icon.ico', sizes=[(16, 16), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)])
          EOF
          go run github.com/akavel/rsrc@latest -ico icon.ico -arch amd64 -o rsrc_windows_amd64.syso
      - name: Build
        run: |
          # Version = tag name, or a build number for manual runs. Repo = whichever repo runs this.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then VER="$GITHUB_REF_NAME"; else VER="build-$GITHUB_RUN_NUMBER"; fi
          echo "VER=$VER" >> "$GITHUB_ENV"
          LD="-s -w -X main.version=$VER -X main.repo=$GITHUB_REPOSITORY"
          go mod tidy
          mkdir dist
          export CGO_ENABLED=0
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LD -H windowsgui" -o dist/shareUp.exe .
          GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags "$LD" -o dist/shareUp-mac-arm64 .
          GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags "$LD" -o dist/shareUp-mac-intel .
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "$LD" -o dist/shareUp-linux .
      - uses: actions/upload-artifact@v4
        with:
          name: shareUp
          path: dist/*
      - name: Release (every build is published so the app can see it)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VER }}
          make_latest: true
          files: dist/*
