name: build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build
        run: |
          go mod tidy
          mkdir dist
          export CGO_ENABLED=0
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/shareUp.exe .
          GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/shareUp-mac-arm64 .
          GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/shareUp-mac-intel .
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/shareUp-linux .
      - uses: actions/upload-artifact@v4
        with:
          name: shareUp
          path: dist/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
